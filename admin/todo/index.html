<!DOCTYPE html><html lang="ja" data-base="/preview-root/"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>管理｜確認リスト</title><link rel="icon" href="/preview-root/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/preview-root/_astro/_slug_.iC-mqqov.css"></head> <body class="adm" data-noruby> <header class="adm-head"> <a class="adm-logo" href="/preview-root/">← サイトへ</a> <b>🛠 管理ページ</b> <nav><a href="/preview-root/admin/">概要</a><a href="/preview-root/admin/images/">画像・図</a><a href="/preview-root/admin/articles/">記事</a><a href="/preview-root/admin/todo/" aria-current="page">確認リスト</a></nav> </header> <main class="adm-main">     <p class="adm-note">レビュー対応で残ったこと（tools/admin/review-todo.md）。確認したらチェック。チェックしていない項目を選んでメモを付け、Claude への依頼文にできます。</p> <div id="todo" class="adm-todo"></div> <div class="adm-bar"> <span id="td-n"></span> <button type="button" id="td-make">💬 選んだ項目を Claude への依頼文にする</button> </div> <dialog id="out" class="adm-dlg"> <h3>Claude への依頼文</h3> <textarea id="out-t" rows="16" readonly></textarea> <p class="adm-dlg-btns"><button type="button" id="out-copy">📋 コピー</button><button type="button" id="out-close" class="sub">閉じる</button></p> </dialog> <script type="application/json" id="todo-data">"## G4 入浴・睡眠・住まい・看取り（完了）\n未確認：浴槽の出入りで介護者が立つ側／室温・湿度・寝床内温度の目安／足浴37〜39℃等／段差解消機の扱い／おむつのテープの向き（haisetsu-03と不一致の可能性）\n全体：suimin-01から削ったホルモン一覧をT24（karada-01）へ／taii-oki「セミファウラー位」表記\n新しい絵：右前・左前（nyuyoku-04④・mitori-02共用）、家計の帯図（sumai-02④）、睡眠障害の見分けフロー（suimin-01②）、ACPと事前指示の関係図（mitori-01①）\n## G1 理念・権利・法律（完了）\n未確認：欠格条項削除2019年・法3条の文言（e-Gov取得不可）／2024報酬改定減算の詳細／性別不合・意思決定支援GLの年／拘禁刑施行日・親告罪（知識ベース）\n全体：communication-02のつながる知識にsongen-03の旧名／[タイトル](../id/)リンクの動作確認／houritsu-02の投資信託の過去問をkenriyougo-03へ集約するか（ユーザー判断）\n## G6 障害・チーム・コミュニケーション（完了）\n未確認：shougaicomm-03 幻視の場面の×「見に行かせる」／team-02の統計は2022年のまま\n全体：PDCAの過去問（第35回）をcommunication-03→team-01へ移動（past_questions・メモIDは未変更）／「閉じた質問」の全体確認\n新しい絵：指点字（shougaicomm-02②）、脊髄レベル図（shougai-01①）、エコマップ・ジェノグラム（shougaishien-02②）\n## G3 ICF・移動・食事・排泄・からだ（完了）\n未確認：廃用症候群の「頻脈」×／義歯を回転させて入れる・タッピング／嚥下の温度めやす／新聞紙が×の理由／フレイル判定5項目\n全体：車いす角度20〜30度に統一（step-ijouと一致）／ブリストル便性状スケール・ファーラー位に統一\n新しい絵：脊髄レベル図（idou-03①）、おむつのテープ向き（haisetsu-03②）、クロックポジション（shokuji-02③）、ストーマ位置（haisetsu-04②）、弁のある心臓（karada-02①）\n## G7 記録・介護過程・安全・医療的ケア（完了）\nkaigokatei-04：事例の読み方の手順・消去チェックリスト・架空事例の例題を追加\n未確認：胸骨圧迫の数値（JRC2025）／半固形栄養剤と腸ろう／吸引の洗浄水交換頻度／長期目標期間・胃ろう交換時期・角化型疥癬の熱処理（一般的目安）\n新しい絵：事例本文の印の塗り分け（kaigokatei-04②）、経管栄養の滴下準備ステップ（iryoucare-03②）、吸引手順・嘔吐物処理のステップ、警戒レベル\n## G8 比較・読みもの（完了）\nyomimono-02に第39回（2027/1/31、申込7/22〜9/2、発表3/23、試験時間）・受験資格・パート合格・合格点推移を一次資料で追加\n未確認：yomimono-01「言い切りの選択肢112個」の母数（要再集計）／第39回の実技試験\n全体：比較記事に過去問・1問1答への導線がほしい\n新しい絵：虐待の通報先の色分け図（hikaku-07④）\n## G2 制度・人口（完了）\njinkou-01 高齢化率20%超→2005年、jinkou-02 障害者数 精神＞身体＞知的（白書R7）、2024年国民生活基礎調査・2024報酬改定・精神科入院形態2024改正などに更新\n未確認：社会保障財源の割合（数字を外した）／精神障害者の実雇用率算定2006年／内閣府意識調査の年／障害者白書をR6版かR7版か\n全体：統計の基準年をサイト全体で決めたい（世帯=2024年調査、介護=2022年大規模調査、障害者白書の版）／自立支援法・総合支援法の「成立・施行」併記を比較記事にも\n新しい絵：セーフティネット3段（chiikifukushi-01②）、要支援で使えるサービスのアイコン早見（kaigohoken-02①）、困りごと→相談先フロー（chiikifukushi-02④）、措置から契約へ2コマ（shakaihoshou-02②）\n## G5 こころ・発達・病気・認知症（完了）\n記憶分類・流動性/結晶性知能・ストレーラー・MCI移行率5〜15%・統計年（2022国民生活基礎調査、2023人口動態）を統一。ninchishocare-04を認知症基本法・基本計画中心に。\n未確認：若年性アルツハイマーの神経症状／家族の4つの苦しみの出典／流動性知能ピーク年齢／死因順位・原因疾患割合・サポーター数・医療センター数（記憶で記入）\n全体：2025年国民生活基礎調査が公表済み（原因2位が骨折・転倒に）→統計基準年の見直し時期\n新しい絵：脳血管疾患3種の位置比較（byouki-02⑤）、骨粗鬆症で骨折しやすい4か所（byouki-03①）、原始反射（hattatsu-01②）\n"</script> <script>
            (function () {
              var md = JSON.parse(document.getElementById('todo-data').textContent), box = document.getElementById('todo');
              var KEY = 'adminTodo', st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
              function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
              var group = '', n = 0;
              md.split('\n').forEach(function (line) {
                var h = line.match(/^##\s+(.*)/); if (h) { group = h[1]; var e = document.createElement('h2'); e.textContent = group; box.appendChild(e); return; }
                var m = line.match(/^(未確認|全体|新しい絵|[^：]{1,12})：(.*)$/); if (!m || /^#/.test(line)) { if (line.trim() && !/^#/.test(line)) { var p = document.createElement('p'); p.className = 'adm-note'; p.textContent = line; box.appendChild(p); } return; }
                var head = document.createElement('h3'); head.textContent = m[1]; box.appendChild(head);
                m[2].split('／').forEach(function (txt) {
                  txt = txt.trim(); if (!txt) return;
                  var id = group + '|' + txt; n++;
                  var row = document.createElement('div'); row.className = 'td-row' + (st[id] && st[id].done ? ' done' : '');
                  row.innerHTML = '<label><input type="checkbox" class="done"> 確認済み</label><label><input type="checkbox" class="pick"> 依頼に入れる</label><span class="td-t"></span><input type="text" class="td-note" placeholder="メモ（判断・調べた結果など）">';
                  row.querySelector('.td-t').textContent = txt;
                  var s = st[id] || {};
                  row.querySelector('.done').checked = !!s.done; row.querySelector('.td-note').value = s.note || '';
                  row.querySelector('.done').onchange = function () { st[id] = st[id] || {}; st[id].done = this.checked; row.classList.toggle('done', this.checked); save(); count(); };
                  row.querySelector('.td-note').oninput = function () { st[id] = st[id] || {}; st[id].note = this.value; save(); };
                  row.dataset.id = id; row.dataset.g = group; row.dataset.t = txt;
                  box.appendChild(row);
                });
              });
              function count() {
                var done = Object.keys(st).filter(function (k) { return st[k].done; }).length;
                document.getElementById('td-n').textContent = '確認済み ' + done + ' / ' + n;
              }
              count();
              var dlg = document.getElementById('out');
              document.getElementById('td-make').onclick = function () {
                var rows = Array.prototype.filter.call(box.querySelectorAll('.td-row'), function (r) { return r.querySelector('.pick').checked; });
                if (!rows.length) { alert('「依頼に入れる」にチェックを入れてください'); return; }
                var t = '介護福祉士ブログの記事で、次のことを確認・修正してください。\n\n' + rows.map(function (r) {
                  var note = r.querySelector('.td-note').value.trim();
                  return '・［' + r.dataset.g.replace(/（.*$/, '') + '］' + r.dataset.t + (note ? '\n　→ ' + note : '');
                }).join('\n');
                document.getElementById('out-t').value = t; dlg.showModal();
              };
              document.getElementById('out-close').onclick = function () { dlg.close(); };
              document.getElementById('out-copy').onclick = function () { var ta = document.getElementById('out-t'); ta.select(); try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); } this.textContent = '✅ コピーしました'; var b = this; setTimeout(function () { b.textContent = '📋 コピー'; }, 1500); };
            })();
          </script>  </main> </body> </html>
