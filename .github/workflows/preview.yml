# 下書きを含めた確認用ビルド。GitHub Pages には公開せず、ビルド結果を preview-build ブランチに置くだけ。
name: Preview build (drafts)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          PUBLIC_SHOW_DRAFTS: '1'
          SITE_BASE: /preview-root
      - name: Push dist to preview-build branch
        run: |
          cd dist
          git init -q -b preview-build
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -qm "preview build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" preview-build
